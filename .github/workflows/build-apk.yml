name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Sync Capacitor Android web assets
        run: npm run cap:sync

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk warung-simulator-2d-v2.0.0-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warung-simulator-2d-v2.0.0-debug-apk
          path: warung-simulator-2d-v2.0.0-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.0"
          cat > release-notes.md << 'NOTES'
          ## Pembaruan Besar v2.0.0 — Buka Cabang & 12 Upgrade
          - **Buka Cabang Warung (4 Lokasi):** Warung Berkah Pusat, Cabang Depan Sekolah (SDN 01 + Bendera Merah Putih), Cabang Kosan & Kampus (+Rp500 harga jual), dan Cabang Pinggir Pasar (+35% traffic & belanja borongan). Cabang lain beroperasi otomatis dan menyetor keuntungan tiap akhir hari!
          - **12 Upgrade Warung:** 8 Upgrade Fasilitas per cabang (termasuk **Etalase Gorengan & Kopi Seduh** dan **Ekspansi Ruangan 5 antrean**) + 4 Upgrade Jaringan Global (**QRIS & Bayar Digital**, **Kipas Angin & Free Wi-Fi**, **Kontrak Gudang Grosir -15%**, **Pelatihan Karyawan Cabang +40%**).
          - **Migrasi Otomatis:** Progres tersimpan dari v1.1.0 otomatis dimigrasikan tanpa kehilangan data.

          Unduh langsung file **warung-simulator-2d-v2.0.0-debug.apk** di bawah ini untuk memasang di HP Android.
          NOTES
          sed -i 's/^          //' release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" warung-simulator-2d-v2.0.0-debug.apk --clobber
          else
            gh release create "$TAG" warung-simulator-2d-v2.0.0-debug.apk \
              --title "Warung Simulator 2D v2.0.0 — Buka Cabang & 12 Upgrade" \
              --notes-file release-notes.md
          fi
