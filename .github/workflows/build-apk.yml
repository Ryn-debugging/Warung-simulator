name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Sync Capacitor Android web assets
        run: npm run cap:sync

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk warung-simulator-2d-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warung-simulator-2d-debug-apk
          path: warung-simulator-2d-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" warung-simulator-2d-debug.apk --clobber
          else
            gh release create "$TAG" warung-simulator-2d-debug.apk \
              --title "Warung Simulator 2D v1.1.0 (MVP)" \
              --notes "Unduh langsung file **warung-simulator-2d-debug.apk** di bawah ini untuk memasang Warung Simulator 2D di perangkat Android (100% offline, orientasi landscape, layar penuh)."
          fi
